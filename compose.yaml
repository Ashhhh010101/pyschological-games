name: psychological-games

x-app-environment: &app-environment
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: 8000
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://psychological_games:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/psychological_games}
  REDIS_URL: redis://redis:6379/0
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-app-security: &app-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777

services:
  migrate:
    build:
      context: .
    command: ["python", "-m", "backend.migrate"]
    environment: *app-environment
    volumes:
      - sqlite-data:/app/data
    restart: "no"
    <<: *app-security

  app:
    build:
      context: .
    ports:
      - "${PORT:-8000}:8000"
    environment: *app-environment
    volumes:
      - sqlite-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    <<: *app-security

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: psychological_games
      POSTGRES_USER: psychological_games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psychological_games -d psychological_games"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    profiles: ["observability"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
  sqlite-data:
