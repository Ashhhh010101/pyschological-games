[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psychological-games"
version = "2.0.0"
description = "A server-authoritative multiplayer arcade about decision-making under pressure."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Psychological Games contributors" }]
keywords = ["fastapi", "game", "multiplayer", "psychology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-redis>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<9",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
psychological-games = "backend.server:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
